<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 0-1: HTML基礎確認</title>
</head>
<body>
    <h1>🌐 Phase 0-1: HTML基礎確認</h1>
    <div>
        <h2>📝 課題1: 自己紹介セクション作成</h2>
        <p><strong>指示:</strong> 下記のHTMLコメント部分に、あなたの自己紹介を書いてください。</p>
        
        <h3>自己紹介</h3>
        <p>名前: 若林杏佳</p>
        <p>職業: 大学生</p>
        <p>趣味: YouTube,料理,謎解き</p>
    
        <p>✅ 完了したら、この課題は終了です</p>
    </div>
    <div>
        <h2>📋 課題2: リスト作成</h2>
        <p><strong>指示:</strong> 好きな食べ物を5つ、番号付きリスト（ol）で作成してください。</p>
        <ol>
            <li>ハンバーグ</li>
            <img src="steak.jpg" width="300" alt="一番好きな食べ物">
            <li>フレンチトースト</li>
            <li>クロワッサン</li>
            <li>グラタン</li>
            <li>パフェ</li>
        </ol>
    </div>
    <div>
        <h2>🔗 課題3: リンク作成</h2>
        <p><strong>指示:</strong> 以下のリンクを作成してください：</p>
        <ul>
            <li><a href="second.html">2ページ目へ</a></li>
        </ul>
      <!-- ここにリンクを作成してください -->
    </div>
</body>
</html>
